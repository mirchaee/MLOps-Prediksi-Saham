name: Daily Stock Data Ingestion

# Jadwal: Senin-Jumat pukul 17:00 WIB (WIB = UTC+7, jadi 10:00 UTC)
# Bisa juga dipicu manual lewat tab "Actions" di GitHub (workflow_dispatch)
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion script
        run: python src/data/ingest_data.py

      - name: Run cleaning script
        run: python src/data/clean_data.py

      - name: Run feature engineering script
        run: python src/features/build_features.py

      - name: Track dataset with DVC
        run: |
          dvc add data/final/BBCA_features.csv
          echo "DVC pointer updated"

      - name: Commit updated data & DVC pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/final/BBCA_features.csv.dvc .gitignore
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(data): update dataset via scheduled ingestion $(date +'%Y-%m-%d')"
          git push
