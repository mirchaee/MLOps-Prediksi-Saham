
name: LK08 MLOps Pipeline Automation

on:
  push:
    branches:
      - main
      - feat/lk08-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/mirchaee/MLOps-Prediksi-Saham.mlflow
  MLFLOW_TRACKING_USERNAME: mirchaee

jobs:
  testing:
    name: Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m pytest tests/ -v

  training:
    name: Automated Training and Evaluation
    runs-on: ubuntu-latest
    needs: testing
    if: github.event_name != 'pull_request'

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]" boto3

      - name: Validate Credentials
        run: |
          if [ -z "$DAGSHUB_TOKEN" ]; then
            echo "DAGSHUB_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Dataset From DVC
        run: |
          dvc pull data/final/BBCA_features.csv.dvc -r dagshub_s3
          dvc status data/final/BBCA_features.csv.dvc

      - name: Automated Model Training
        run: |
          python -m src.models.train \
            --n_estimators 100 \
            --max_depth 4

      - name: Automated Model Evaluation
        run: |
          python -m src.models.evaluate \
            --threshold 0.58

      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lk08-training-results
          path: outputs/
          retention-days: 7

  registry:
    name: Automated Model Registry
    runs-on: ubuntu-latest
    needs: training
    if: github.event_name != 'pull_request'

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]" boto3

      - name: Download Training Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lk08-training-results
          path: outputs/

      - name: Pull Dataset From DVC
        run: |
          dvc pull data/final/BBCA_features.csv.dvc -r dagshub_s3

      - name: Evaluate Registry Eligibility
        run: python -m src.models.registry

      - name: Upload Registry Result
        uses: actions/upload-artifact@v4
        with:
          name: lk08-registry-result
          path: outputs/registry_result.json
          retention-days: 7
