
services:
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-bbca:lk09

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5055"
      - --workers
      - "1"
      - --allowed-hosts
      - "mlflow-server:5055,localhost:5055,127.0.0.1:5055"

    ports:
      - "127.0.0.1:5055:5055"

    volumes:
      - type: bind
        source: ./mlflow.db
        target: /mlflow/mlflow.db
      - type: bind
        source: ./mlartifacts
        target: /mlflow/mlartifacts

    networks:
      - mlops-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-bbca:lk09

    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5055
      MODEL_URI: models:/bbca-direction-classifier/1

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      mlflow-server:
        condition: service_healthy

    networks:
      - mlops-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge
